  <!-- Break Sparks -->
  <circle cx="34" cy="30" r="2.2" fill="#fbbf24" />
  <circle cx="38" cy="36" r="1.5" fill="#34d399" />

  <!-- Ascending Fresh Leaf / Vital Breath -->
