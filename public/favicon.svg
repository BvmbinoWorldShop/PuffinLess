  <path d="M16 44 L28 32 C29 31 30.5 31 31.5 32 C32.5 33 32.5 34.5 31.5 35.5 L19.5 47.5 C18.5 48.5 17 48.5 16 47.5 C15 46.5 15 45 16 44 Z" fill="white" fill-opacity="0.95" />
