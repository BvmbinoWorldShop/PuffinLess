name: Quality CI & Production Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run code linter
        run: npm run lint

      - name: Verify dependencies for vulnerabilities
        run: npm run audit

      - name: Run unit test suite
        run: npm run test:unit

      - name: Run deep persistence verification
        run: node tests/deep-persistence-check.js

      - name: Build production bundle
        run: npm run build

      - name: Run real browser verification suite
        run: npm run test:browser
